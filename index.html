<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFF7F2">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link rel="shortcut icon" href="icon-512.png">
<title>予卿</title>
<style>
  /* ---------- 色彩令牌：浅色 ---------- */
  :root{
    color-scheme: light;
    --bg:#FFF7F2;
    --bg-glow:#FBEADF;
    --card:#FFFFFF;
    --card-tint:#FFFBF7;
    --ink:#332B26;
    --ink-2:#655A53;
    --ink-3:#7E7168;
    --line:#EFE2D8;
    --line-soft:#F7EFE9;
    --accent:#E4795F;
    --accent-deep:#B2543D;
    --accent-soft:#FDECE6;
    --accent-line:#EFB9A6;
    --chip:#F5EDE7;
    --good:#4F8E72;
    --good-deep:#37664F;
    --good-soft:#E9F4EE;
    --good-line:#D6E8DD;
    --neutral:#F3EEE9;
    --danger:#B8482F;
    --danger-soft:#FDECE9;
    --input:#FFFDFB;
    --dot:#EEE1D7;
    --tl-dot:#EFBBA8;
    --why-bg:#FFF8F3;
    --why-ink:#7C5B49;
    --shadow:0 5px 20px rgba(176,136,116,.12);
    --shadow-sm:0 2px 8px rgba(176,136,116,.09);
    --hero-from:#FFFFFF;
    --hero-to:#FFF1E8;
    --tabbar:rgba(255,255,255,.93);
    --radius:24px;
    --font-sans:-apple-system,BlinkMacSystemFont,"HarmonyOS Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --font-serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC",SimSun,"Times New Roman",serif;
  }
  /* ---------- 色彩令牌：深色（晚上用不刺眼） ---------- */
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#15110E;
    --bg-glow:#221A15;
    --card:#201A16;
    --card-tint:#251E19;
    --ink:#F3EAE2;
    --ink-2:#C4B4A9;
    --ink-3:#9C8C81;
    --line:#332A23;
    --line-soft:#2A231D;
    --accent:#F08A6B;
    --accent-deep:#F7B49B;
    --accent-soft:#3A2620;
    --accent-line:#5B3A2E;
    --chip:#2A231E;
    --good:#7FBF9E;
    --good-deep:#A5D8BB;
    --good-soft:#1D2923;
    --good-line:#2B3D34;
    --neutral:#2A231E;
    --danger:#F09A82;
    --danger-soft:#3A211C;
    --input:#241E19;
    --dot:#3A302A;
    --tl-dot:#7A4A3A;
    --why-bg:#241D18;
    --why-ink:#D9B49E;
    --shadow:0 6px 22px rgba(0,0,0,.45);
    --shadow-sm:0 2px 10px rgba(0,0,0,.35);
    --hero-from:#241D18;
    --hero-to:#2E2119;
    --tabbar:rgba(32,26,22,.94);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);
    background-image:radial-gradient(120% 55% at 50% 0%, var(--bg-glow) 0%, transparent 62%);
    background-repeat:no-repeat;
    color:var(--ink);
    font-family:var(--font-sans);
    font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    transition:background-color .3s ease,color .3s ease;
  }
  .app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
  .scroll{flex:1;overflow-y:auto;padding:0 18px calc(96px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .topbar{padding:calc(20px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .topbar h1{margin:0;font-size:25px;letter-spacing:-.2px;font-weight:600}
  .topbar .sub{font-size:12.5px;color:var(--ink-3);letter-spacing:.6px}
  .heart{font-size:20px;transform:translateY(2px)}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:21px;margin-bottom:13px;
        border:1px solid var(--line-soft);transition:background-color .3s ease,border-color .3s ease}
  .card.flat{box-shadow:none;border:1px dashed var(--line);background:transparent}
  .card-note{box-shadow:none;background:var(--card-tint);border:1px solid var(--line)}
  .card-done{background:var(--good-soft);border-color:var(--good-line)}
  .card-logi{background:var(--card-tint);border-color:var(--accent-line)}
  .card-warn{background:var(--danger-soft);border-color:var(--accent-line)}
  .card-bday{background:linear-gradient(160deg,var(--hero-from),var(--hero-to));border-color:var(--accent-line)}
  .card-fest{background:linear-gradient(160deg,var(--card),var(--hero-to));border-color:var(--accent-line)}
  h2{font-size:16px;margin:0 0 10px;font-weight:600}
  h3{font-size:14px;margin:0 0 8px;font-weight:600;color:var(--ink-2)}
  .muted{color:var(--ink-3);font-size:13.5px;line-height:1.65}
  .tag{display:inline-block;font-size:11.5px;padding:3.5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep);margin:0 6px 6px 0;white-space:nowrap}
  .tag.grey{background:var(--neutral);color:var(--ink-2)}
  .tag.green{background:var(--good-soft);color:var(--good-deep)}
  .btn{display:block;width:100%;border:none;border-radius:17px;padding:15px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
       transition:transform .12s ease,filter .12s ease,background-color .3s ease}
  .btn:active{transform:scale(.982)}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(228,121,95,.28)}
  .btn.primary:active{filter:brightness(.96)}
  .btn.ghost{background:var(--chip);color:var(--ink-2);font-weight:500}
  .btn.text{background:none;color:var(--ink-3);font-weight:500;font-size:14px;padding:10px}
  .btn.danger{background:var(--danger-soft);color:var(--danger)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}

  /* 今日卡（主卡，视觉重心） */
  .today-card{position:relative;background:linear-gradient(158deg,var(--hero-from) 0%,var(--hero-to) 100%);
              border:1px solid var(--accent-line);padding:24px 22px;overflow:hidden}
  .today-card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
              background:linear-gradient(90deg,var(--accent),var(--accent-line) 60%,transparent)}
  .today-cat{font-size:11.5px;color:var(--accent-deep);letter-spacing:2.4px;margin-bottom:12px;font-weight:600}
  .today-title{font-family:var(--font-serif);font-size:25px;line-height:1.5;font-weight:600;letter-spacing:.3px;margin:0 0 13px}
  .today-how{font-size:14.5px;color:var(--ink-2);margin:0 0 15px;padding-left:13px;border-left:2.5px solid var(--accent-line);line-height:1.65}
  .meta{display:flex;flex-wrap:wrap;gap:6px 0;margin-bottom:13px}
  .why{position:relative;font-size:13.5px;color:var(--why-ink);background:var(--why-bg);border-radius:15px;padding:12px 14px 12px 32px;line-height:1.6}
  .why:before{content:"";position:absolute;left:15px;top:19px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .daycount{text-align:center;font-size:12.5px;color:var(--ink-3);letter-spacing:.6px;margin:6px 0 18px}
  .moodpills{display:flex;gap:8px}
  .mood{flex:1;text-align:center;padding:10px 0;border-radius:15px;background:var(--chip);color:var(--ink-2);font-size:14px;cursor:pointer;
        border:1.5px solid transparent;transition:background-color .18s,border-color .18s,color .18s}
  .mood:active{transform:scale(.98)}
  .mood.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep);font-weight:600}

  /* 底部导航 */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
    background:var(--tabbar);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;
    padding-bottom:env(safe-area-inset-bottom);z-index:30
  }
  .tab{flex:1;padding:9px 0 8px;text-align:center;cursor:pointer;color:var(--ink-3);font-size:11.5px;letter-spacing:.5px}
  .tab.on{color:var(--accent)}
  .tab svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* 弹层 */
  .sheet{position:fixed;inset:0;background:rgba(30,22,17,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .sheet.on{display:flex}
  .sheet-inner{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
               animation:up .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 40px rgba(0,0,0,.18)}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
  textarea,input[type=text],input[type=date],select{
    width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15.5px;
    font-family:inherit;color:var(--ink);background:var(--input);outline:none;margin-bottom:12px
  }
  textarea:focus,input:focus,select:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{min-height:86px;resize:none;line-height:1.6}
  label{display:block;font-size:13.5px;color:var(--ink-2);margin:0 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .chip{padding:9px 14px;border-radius:999px;background:var(--chip);color:var(--ink-2);font-size:14px;cursor:pointer;border:1.5px solid transparent;
        transition:background-color .18s,border-color .18s,color .18s}
  .chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep);font-weight:600}
  .chk{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border-radius:15px;background:var(--card-tint);
       margin-bottom:8px;font-size:14.5px;line-height:1.6;cursor:pointer;border:1px solid var(--line-soft);
       transition:background-color .18s,border-color .18s,transform .12s}
  .chk:active{transform:scale(.99)}
  .chk.on{background:var(--good-soft);border-color:var(--good-line);color:var(--good-deep)}
  .chk .box{flex:0 0 21px;height:21px;border-radius:8px;border:1.5px solid var(--dot);background:var(--card);
            display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px;
            transition:background-color .18s,border-color .18s}
  .chk.on .box{background:var(--good);border-color:var(--good)}
  .chk.on div{text-decoration:line-through;text-decoration-color:var(--good-line)}

  /* 引导 */
  .onboard{padding:calc(40px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
  .dots{display:flex;gap:5px;margin:0 auto 26px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dot);transition:background-color .25s,width .25s}
  .dot.on{background:var(--accent);width:18px;border-radius:4px}
  .onboard h2{font-size:21px;line-height:1.5;margin:0 0 8px}
  .onboard .lead{font-size:14px;color:var(--ink-3);margin:0 0 22px}
  .grow{flex:1}
  .big-hello{font-size:26px;line-height:1.55;font-weight:600;margin:0 0 14px}

  /* 记录 */
  .stat{text-align:center;padding:16px 8px}
  .stat .n{font-size:27px;font-weight:600;color:var(--accent);line-height:1.2}
  .stat .l{font-size:12px;color:var(--ink-3);margin-top:2px}
  .tl{position:relative;padding-left:18px}
  .tl:before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1.5px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 18px}
  .tl-item:before{content:"";position:absolute;left:-18px;top:7px;width:9px;height:9px;border-radius:50%;
                  background:var(--tl-dot);border:2px solid var(--card);box-shadow:0 0 0 2px var(--accent-soft)}
  .tl-date{font-size:12px;color:var(--ink-3);letter-spacing:.3px}
  .tl-title{font-size:15px;font-weight:600;margin:1px 0 3px}
  .tl-note{font-size:13.5px;color:var(--ink-2)}
  .tl-note:before{content:"“"}.tl-note:after{content:"”"}

  /* 分享卡 */
  .share-card{background:linear-gradient(165deg,var(--card),var(--hero-to));border-radius:20px;padding:26px 22px;
              border:1px solid var(--accent-line);position:relative;overflow:hidden}
  .share-card .wm{position:absolute;right:-16px;bottom:-24px;font-size:110px;opacity:.06}
  .share-card .d{font-size:12px;color:var(--ink-3);letter-spacing:2px}
  .share-card .t{font-family:var(--font-serif);font-size:21px;font-weight:600;line-height:1.55;margin:10px 0}
  .share-card .f{font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:10px;margin-top:14px}

  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(48,38,31,.93);color:#fff;font-size:14px;
         padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:80vw;text-align:center}
  .toast.on{opacity:1;bottom:120px}
  .fade{animation:fade .3s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .confetti{position:fixed;top:-10px;width:8px;height:14px;border-radius:2px;opacity:.9;animation:fall linear forwards;z-index:60;pointer-events:none}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .kv{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px}
  .kv:last-child{border-bottom:none}
  .kv .v{font-weight:600}

  /* 生日当天的时间线清单 */
  .plan{position:relative;padding-left:4px}
  .plan .chk{position:relative}
  .plan .chk b{color:var(--ink);font-weight:600;margin-right:4px}
  .plan .chk.on b{color:var(--good-deep)}

  /* 蛋糕那句留言 */
  .bday-msg{font-family:var(--font-serif);font-size:17px;line-height:1.85;color:var(--ink);margin:6px 0 0;
            letter-spacing:.2px}

  /* ---------- 给她的那一页：交付那一刻的视觉 ---------- */
  .forher{min-height:100vh;display:flex;flex-direction:column;
          padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
          background:radial-gradient(125% 42% at 50% 0%, var(--bg-glow) 0%, transparent 62%)}
  .fh-top{display:flex;justify-content:space-between;align-items:center;padding:0 8px 12px}
  .fh-top span{font-size:12px;color:var(--ink-3);letter-spacing:1.6px}
  .fh-exit{background:none;border:none;color:var(--ink-3);font-size:12.5px;font-family:inherit;padding:6px 4px;cursor:pointer;letter-spacing:.5px}
  .fh-card{flex:1;display:flex;flex-direction:column;position:relative;
           background:var(--card);border:1px solid var(--line);border-radius:26px;
           padding:26px 24px 24px;box-shadow:var(--shadow);
           animation:fhIn .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes fhIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .fh-seal{align-self:center;font-family:var(--font-serif);font-size:13px;letter-spacing:7px;text-indent:7px;
           color:var(--accent-deep);border:1px solid var(--accent-line);border-radius:9px;
           padding:6px 10px 6px 16px;margin:2px 0 28px;background:var(--card-tint)}
  .fh-hero,.fh-block{animation:fhUp .65s ease both}
  .fh-hero{animation-delay:.10s}
  .fh-block:nth-of-type(2){animation-delay:.18s}
  .fh-block:nth-of-type(3){animation-delay:.26s}
  .fh-block:nth-of-type(4){animation-delay:.34s}
  @keyframes fhUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .fh-msg{font-family:var(--font-serif);font-size:23px;line-height:2.05;letter-spacing:.5px;color:var(--ink);margin:0}
  .fh-sign{text-align:right;font-size:13.5px;color:var(--ink-3);margin-top:18px;letter-spacing:2px}
  .fh-rule{width:60px;height:1px;background:var(--accent-line);margin:30px auto}
  .fh-block{margin-bottom:26px}
  .fh-label{font-size:11.5px;letter-spacing:2.6px;color:var(--accent-deep);font-weight:600;margin-bottom:12px}
  .fh-p{font-size:15px;color:var(--ink-2);margin:0;line-height:1.85}
  .fh-rules{list-style:none;margin:0;padding:0}
  .fh-rules li{display:flex;gap:13px;align-items:baseline;padding:9px 0}
  .fh-rules li i{flex:0 0 18px;text-align:center;font-style:normal;font-family:var(--font-serif);font-size:15px;color:var(--accent)}
  .fh-rules li span{font-size:15px;line-height:1.75;color:var(--ink)}
  .fh-tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);
          color:var(--accent-deep);letter-spacing:1.4px;margin-bottom:11px}
  .fh-task{position:relative;overflow:hidden;border-radius:18px;padding:18px;
           background:linear-gradient(158deg,var(--hero-from),var(--hero-to));border:1px solid var(--accent-line)}
  .fh-task:before{content:"";position:absolute;left:0;right:0;top:0;height:2.5px;
                  background:linear-gradient(90deg,var(--accent),var(--accent-line) 62%,transparent)}
  .fh-task-title{font-family:var(--font-serif);font-size:19px;line-height:1.6;font-weight:600;letter-spacing:.2px}
  .fh-task-how{font-size:13.5px;color:var(--ink-2);margin-top:7px}
  .fh-why{font-size:12.5px;color:var(--why-ink);margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);line-height:1.6}
  .fh-foot{margin-top:auto;padding-top:24px;text-align:center;font-size:11px;color:var(--ink-3);letter-spacing:3px}
  /* 弹层里的分步说明 */
  .steps{margin:0;padding-left:22px;font-size:14.5px;line-height:1.95;color:var(--ink)}
  .steps li{padding:1px 0}
  .steps li::marker{color:var(--accent);font-weight:600}
  /* 首页底部的「记一句」入口：捕获要近，不能藏在菜单里 */
  .capture-bar{display:flex;gap:8px;margin-bottom:4px}
  .capture-row{display:flex;align-items:center;gap:8px;justify-content:center;
               padding:14px;border-radius:16px;border:1px dashed var(--line);
               color:var(--ink-2);font-size:14px;cursor:pointer;background:transparent;
               transition:background-color .18s,border-color .18s;flex:1;min-width:0}
  .capture-row.go{border-style:solid;border-color:var(--accent-line);background:var(--accent-soft);
                  color:var(--accent-deep);font-weight:600}
  .capture-row:active{background:var(--card-tint)}
  .capture-row .cap-ico{color:var(--accent);font-size:14px}
  .capture-row .cap-badge{margin-left:2px;background:var(--accent);color:#fff;border-radius:999px;
                          font-size:11.5px;padding:1px 7px;font-weight:600}
  /* 无障碍：键盘焦点可见、动效可关 */
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:8px}
  @media (prefers-reduced-motion: reduce){
    *,*:before,*:after{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheetInner"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   予卿 · Phase 1 Demo
   单文件、离线、纯本地存储。无任何网络请求。
   ============================================================ */

/* ---------- 1. 任务库（60 条，与 docs/04 同源） ---------- */
const LIB = [
// A 分担

function leapMonth(y){ return LUNAR_INFO[y - 1900] & 0xf; }
function leapDays(y){ return leapMonth(y) ? ((LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29) : 0; }
function monthDays(y,m){ return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
function lunarYearDays(y){
  let sum = 348;
  for(let i = 0x8000; i > 0x8; i >>= 1){ sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0; }
  return sum + leapDays(y);
}
function solarToLunar(y, m, d){
  let offset = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000);
  let i, temp = 0;
  for(i = 1900; i < 2050 && offset > 0; i++){ temp = lunarYearDays(i); offset -= temp; }
  if(offset < 0){ offset += temp; i--; }
  const year = i;
  const leap = leapMonth(year);
  let isLeap = false, j;
  for(j = 1; j < 13 && offset > 0; j++){
    if(leap > 0 && j === leap + 1 && !isLeap){ --j; isLeap = true; temp = leapDays(year); }
    else { temp = monthDays(year, j); }
    if(isLeap && j === leap + 1) isLeap = false;
    offset -= temp;
  }
  if(offset === 0 && leap > 0 && j === leap + 1){
    if(isLeap){ isLeap = false; } else { isLeap = true; --j; }
  }
  if(offset < 0){ offset += temp; --j; }
  return { year, month: j, day: offset + 1, isLeap };

const _lunarCache = {};
function lunarToSolar(ly, lm, ld){
  const key = ly + '-' + lm + '-' + ld;
  if(key in _lunarCache) return _lunarCache[key];
  let found = null;
  const start = Date.UTC(ly, 0, 20);
  for(let i = 0; i < 400; i++){
    const t = new Date(start + i * 86400000);
    const Y = t.getUTCFullYear(), M = t.getUTCMonth() + 1, D = t.getUTCDate();
    const l = solarToLunar(Y, M, D);
    if(l.year === ly && l.month === lm && l.day === ld && !l.isLeap){ found = { y: Y, m: M, d: D }; break; }
  }
  _lunarCache[key] = found;
  return found;
}

  const first = new Date(y, m - 1, 1);

function upcomingDays(dateStr, horizon){
  horizon = horizon || 400;
  const t = parseDay(dateStr);
  const out = [];
  const push = (label, ds, meta) => {
    if(!ds) return;
    const dd = daysBetween(dateStr, ds);
    if(dd < 0 || dd > horizon) return;
    out.push(Object.assign({ label, date: ds, days: dd }, meta || {}));
  };
  // 节日：跨两年查，覆盖春节/元宵落在年初的情况
  [t.getFullYear(), t.getFullYear() + 1].forEach(y => {
    FESTIVALS.forEach(f => {
      const s = festivalSolarDate(f, y);
      if(!s) return;
      push(f.label, todayStr(new Date(y, s.m - 1, s.d)), { kind:'festival', key:f.key, tip:f.tip });
    });
  });
  const p = S.profile;
  if(p.birthday){ const s = mdOf(p.birthday), n = nextSolarMMDD(dateStr, s.m, s.d); push(p.name + '的生日', n.date, { kind:'birthday', key:'birthday' }); }
  if(p.anniversary){ const s = mdOf(p.anniversary), n = nextSolarMMDD(dateStr, s.m, s.d); push('结婚纪念日', n.date, { kind:'anniversary', key:'anniversary' }); }
  (p.days || []).forEach(day => {
    const n = nextCustomDate(dateStr, day);
    if(n) push(day.label, n.date, { kind: day.kind, key: day.id, lunar: !!day.lunar });
  });
  out.sort((a, b) => a.days - b.days || (a.label > b.label ? 1 : -1));
  // 同一天多个节日只保留第一个（避免重复提示）
  const seen = {};
  return out.filter(x => { const k = x.date + '|' + x.kind; if(seen[k]) return false; seen[k] = 1; return true; });
}
/* 今天的情境：今天是什么日子、哪些日子临近、是否需要安静 */
function dayContext(dateStr){
  const list = upcomingDays(dateStr, 8);
  const today = list.filter(x => x.days === 0);
  const prep = list.filter(x => x.days > 0 && x.days <= 7);
  const quiet = today.some(x => x.kind === 'quiet');
  return { list, today, prep, quiet };
}

/* ---------- 4. 推荐引擎 ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rnd = mulberry32(seed), a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function lastDoneIndex(){
  const m = {};
  S.done.forEach(r=>{ const g = daysBetween(r.date, todayStr()); if(m[r.id]===undefined || g < m[r.id]) m[r.id] = g; });
  return m;
}
function specialKind(date){
  const p = S.profile, d = parseDay(date), md = [d.getMonth()+1, d.getDate()].join('-');
  if(p.birthday && [parseDay(p.birthday).getMonth()+1, parseDay(p.birthday).getDate()].join('-') === md) return 'birthday';
  if(p.anniversary && [parseDay(p.anniversary).getMonth()+1, parseDay(p.anniversary).getDate()].join('-') === md) return 'anniversary';
  if(p.babyBirthday){
    const b = parseDay(p.babyBirthday), months = (d.getFullYear()-b.getFullYear())*12 + (d.getMonth()-b.getMonth());
    if(d.getDate()===b.getDate() && months>0 && months<=36) return 'babymonth';
  }
  return null;
}
function candidates(date, ctx){
  const mood = S.mood[date] || '一般';
  const {timeBudget, costBudget, avoid, stage} = S.profile;
  const recent = lastDoneIndex();
  const maxMin = mood === '很累' ? Math.min(timeBudget||999, 30) : (timeBudget || 999);
  ctx = ctx || dayContext(date);

  // 专属日任务：节日前后 7 天内、以及重要日子临近时的准备任务
  const extra = [];
  if(!ctx.quiet){
    ctx.list.filter(x => x.days <= 7).forEach(x => {
      if(x.kind === 'festival') FEST_LIB.forEach(t => { if(t.fest.includes(x.key)) extra.push(t); });
    });
    if(ctx.prep.length || ctx.today.length) PREP_LIB.forEach(t => extra.push(t));
  }
  const seenId = {};
  const pool = library().concat(extra).filter(t => { if(seenId[t.id]) return false; seenId[t.id] = 1; return true; });

  // 安静日：不推任何"制造惊喜"的任务，只留下能做的那类
  const quietBan = ['惊喜','表达','回忆'];

  return pool.filter(t=>{
    if(S.banned.includes(t.id)) return false;
    // 「她不感兴趣」→ 硬排除同类：否则只是扣分，"同类不会再出现"就是空话
    if((S.profile.disliked||[]).some(x => (t.tags||[]).includes(x))) return false;
    if(recent[t.id] !== undefined && recent[t.id] < 14) return false;
    if(t.min > maxMin) return false;
    if(t.cost > costBudget) return false;
    if(avoid.includes('别乱花钱') && t.cost > 0) return false;
    if(stage === '产后恢复期' && (t.flags.includes('需要外出') || t.flags.includes('需要体力'))) return false;
    if(t.flags.includes('需要她配合')) return false;
    if(ctx.quiet && quietBan.includes(t.cat)) return false;
    return true;
  });
}
function scoreOf(t, date, ctx){
  const mood = S.mood[date] || '一般';
  const sp = specialKind(date);
  ctx = ctx || dayContext(date);
  const recent = lastDoneIndex();
  let s = 1.0, reasons = [];

  const hitLikes = t.tags.filter(x=>S.profile.likes.includes(x));
  s += 2.0 * hitLikes.length;
  if(hitLikes.length) reasons.push('你喜欢的方式里有「'+hitLikes[0]+'」');

  const hitAvoid = t.tags.filter(x=>S.profile.avoid.includes(x));
  s -= 3.0 * hitAvoid.length;

  s += (CAT_META[t.cat] ? CAT_META[t.cat].moodWeights[mood] : 0);

  if(mood === '很累' && ['分担','独处','亲子'].includes(t.cat)) reasons.push('她说今天很累，先把事接过来最有用');
  if(mood === '很好' && ['回忆','惊喜','表达'].includes(t.cat)) reasons.push('她今天状态不错，可以做点有仪式感的');

  if(sp === 'birthday' && ['惊喜','回忆','表达'].includes(t.cat)){ s += 4.0; reasons.push('今天是她的生日'); }
  if(sp === 'anniversary' && ['回忆','表达'].includes(t.cat)){ s += 4.0; reasons.push('今天是你们的纪念日'); }
  if(sp === 'babymonth' && t.flags.includes('涉及亨亨')){ s += 4.0; reasons.push('亨亨今天满月龄，拍点东西留下来'); }

  const g = recent[t.id];
  if(g !== undefined){ if(g>=31) { s += 1.0; } else if(g>=15) { s += 0.5; } }

  if(S.profile.stage === '产后恢复期' && t.flags.includes('需要体力')) s -= 2.0;
  if(S.profile.stage === '哺乳期' && t.flags.includes('需要外出')) s -= 1.0;

  // 节日当天 / 临近
  if(t.fest){
    const now = ctx.today.find(x => x.kind === 'festival' && t.fest.includes(x.key));
    const near = ctx.list.find(x => x.kind === 'festival' && t.fest.includes(x.key));
    if(now){ s += 5.0; reasons.unshift('今天是' + now.label); }
    else if(near){ s += 2.0; reasons.unshift(near.label + '还有 ' + near.days + ' 天'); }
  }
  // 重要日子前的准备
  if(t.prep){
    const nx = ctx.prep[0] || ctx.today[0];
    if(nx){
      s += 3.0 + (t.pri || 0) * 0.6;
      reasons.unshift(nx.days === 0 ? ('今天就是' + nx.label) : ('距离' + nx.label + '还有 ' + nx.days + ' 天，先准备'));
    }
  }
  if(ctx.quiet) reasons.unshift('今天不适合搞惊喜，安静地做点实事');

  if(!reasons.length){
    reasons.push(t.cat === '分担' ? '今天能替她省一件心' : '换一种方式让她知道你在');
  }
  return {s, reasons};
}
function pick(date, reroll){
  const ctx = dayContext(date);
  const cands = candidates(date, ctx);
  if(!cands.length) return {task:null, why:'任务库今天没有合适的了，去「更多」里加一条专属的。'};
  const scored = cands.map(t=>{ const r = scoreOf(t, date, ctx); return {t, s:r.s, reasons:r.reasons}; })
                      .sort((a,b)=> b.s - a.s);
  // 取分数最高的前 8 条，再用"当天日期"作种子的抖动排序：
  // 分数决定大体顺序（今天最该做的那件排前面），抖动带来变化（不会每天都是同一件）。
  const top = scored.slice(0, Math.min(8, scored.length));
  const seed = parseInt(date.replace(/-/g,''),10) || 20261007;
  const rnd = mulberry32(seed);
  const ranked = top.map(x => ({ t: x.t, why: x.reasons, k: x.s + rnd() * 0.9 }))
                    .sort((a,b)=> b.k - a.k);
  const idx = Math.min(reroll||0, ranked.length-1);
  const chosen = ranked[idx];
  return {task:chosen.t, why:(chosen.why || []).slice(0,2).join('，')};
}
function todayPick(){
  const d = todayStr();
  if(!S.picks[d]) S.picks[d] = {reroll:0};
  const p = pick(d, S.picks[d].reroll);
  return {date:d, ...p, reroll:S.picks[d].reroll};
}

function fmtDate(s){
  const d = parseDay(s), w = ['日','一','二','三','四','五','六'][d.getDay()];
  return (d.getMonth()+1)+' 月 '+d.getDate()+' 日 · 周'+w;

function nextOccur(dateStr){
  if(!dateStr) return null;
  const t = parseDay(todayStr()), o = parseDay(dateStr);
  let next = new Date(t.getFullYear(), o.getMonth(), o.getDate());
  if(daysBetween(todayStr(), todayStr(next)) < 0) next = new Date(t.getFullYear()+1, o.getMonth(), o.getDate());
  return {days: daysBetween(todayStr(), todayStr(next)), md:(o.getMonth()+1)+' 月 '+o.getDate()+' 日'};
}
function yearsSince(dateStr){
  if(!dateStr) return 0;
  const a = parseDay(dateStr), t = parseDay(todayStr());
  let y = t.getFullYear() - a.getFullYear();
  if(t.getMonth() < a.getMonth() || (t.getMonth() === a.getMonth() && t.getDate() < a.getDate())) y -= 1;
  return Math.max(0, y);
}
/* ---------- 「你们的过去」问答 ---------- */
/* ===== 从一句话里抽日期：规则版（离线、不猜、可解释） ===== */
const CN_NUM = {'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12};
function cnNum(s){ if(s==null) return null; if(/^\d+$/.test(s)) return +s; return (s in CN_NUM) ? CN_NUM[s] : null; }
function extractDates(text){
  const t = String(text||''), out = [], now = new Date();
  const add = (y,m,d,src,ctx) => {
    if(!m || !d || m<1 || m>12 || d<1 || d>31) return;
    out.push({year:y||null, m:m, d:d, src:src, ctx:ctx||''});
  };
  // 2014年6月21日 / 二〇一四年…就先不管了
  for(const m of t.matchAll(/((?:19|20)\d{2})\s*年\s*(\d{1,2}|[一二三四五六七八九十]{1,3})\s*月\s*(\d{1,2}|[一二三四五六七八九十]{1,3})\s*[日号]/g))
    add(+m[1], cnNum(m[2]), cnNum(m[3]), m[0], t.slice(Math.max(0,m.index-4), m.index));
  // 2014-06-21 / 2014.6.21 / 2014/6/21
  for(const m of t.matchAll(/((?:19|20)\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})/g))
    add(+m[1], +m[2], +m[3], m[0], t.slice(Math.max(0,m.index-4), m.index));
  // 6月21日（不带年份）
  for(const m of t.matchAll(/(\d{1,2}|[一二三四五六七八九十]{1,3})\s*月\s*(\d{1,2}|[一二三四五六七八九十]{1,3})\s*[日号]/g)){
    const ctx = t.slice(Math.max(0, m.index-4), m.index);
    let y = null;
    if(/去年/.test(ctx)) y = now.getFullYear() - 1;
    else if(/前年/.test(ctx)) y = now.getFullYear() - 2;
    else if(/今年|那年|当天/.test(ctx)) y = now.getFullYear();
    add(y, cnNum(m[1]), cnNum(m[2]), m[0], ctx);
  }
  const seen = {};
  return out.filter(x => { const k = x.m+'-'+x.d; if(seen[k]) return false; seen[k] = 1; return true; })
            .sort((a,b) => (b.year?1:0) - (a.year?1:0));
}
function hasDay(m,d){
  const md = String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  if(S.profile.birthday && mdOf(S.profile.birthday).m+'-'+mdOf(S.profile.birthday).d === m+'-'+d) return true;
  return (S.profile.days||[]).some(x => x.md === md);
}
function guessDayLabel(){
  const t = Array.prototype.slice.call(arguments).map(x=>String(x||'')).join(' ');
  if(/领证|结婚证|登记/.test(t)) return '领证纪念日';
  if(/婚礼|办酒|婚宴/.test(t)) return '婚礼纪念日';
  if(/在一起|相恋|恋爱|看球|世界杯/.test(t)) return '相恋纪念日';
  if(/出生|出生那天/.test(t)) return '出生日';
  if(/搬家|新房|入住/.test(t)) return '搬进新家的日子';
  return '纪念日';
}

function nextStoryQ(){
  const st = S.story || (S.story = {answers:{}, skipped:[], on:{}});
  st.answers = st.answers || {}; st.skipped = st.skipped || [];
  let q = STORY_ALL.find(x => !st.answers[x.id] && !st.skipped.includes(x.id));
  if(!q){
    const left = STORY_ALL.filter(x => !st.answers[x.id]);
    if(left.length){ st.skipped = []; q = left[0]; }
  }
  return q || null;
}
function storyProgress(){
  const a = (S.story && S.story.answers) || {};
  return { done: STORY_ALL.filter(x => a[x.id]).length, total: STORY_ALL.length };
}
function streak(){
  const days = new Set(S.done.map(r=>r.date));
  let n = 0, cur = new Date();
  if(!days.has(todayStr(cur))) cur.setDate(cur.getDate()-1);
  while(days.has(todayStr(cur))){ n++; cur.setDate(cur.getDate()-1); }
  return n;
}
function last7(){
  const out = [];
  for(let i=0;i<7;i++){ const d = new Date(); d.setDate(d.getDate()-i); out.push(todayStr(d)); }
  return S.done.filter(r=>out.includes(r.date)).length;
}

function afterOnboard(){
  document.querySelectorAll('.chips[data-group]').forEach(box=>{
    box.addEventListener('click', e=>{
      const chip = e.target.closest('.chip'); if(!chip) return;
      const group = box.dataset.group, val = chip.dataset.val;
      if(group === 'likes' || group === 'avoid'){
        const arr = group === 'likes' ? ob.likes : ob.avoid;
        const i = arr.indexOf(val); i<0 ? arr.push(val) : arr.splice(i,1);
        chip.classList.toggle('on');
      } else {
        ob[group] = group === 'stage' ? val : Number(val);
        box.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
        chip.classList.add('on');
      }
    });
  });
}

/* ---------- 7. 交互 ---------- */
function bind(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ TAB = el.dataset.tab; render(); window.scrollTo(0,0); };
  });
  document.querySelectorAll('[data-mood]').forEach(el=>{
    el.onclick = ()=>{ S.mood[todayStr()] = el.dataset.mood; save(); render(); };
  });
  document.querySelectorAll('[data-act]').forEach(el=>{
    el.onclick = ()=> handle(el.dataset.act);
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=>{
      S.profile.days = (S.profile.days || []).filter(x => x.id !== el.dataset.del);
      save(); render(); toast('已删除');
    };
  });
  document.querySelectorAll('[data-fill]').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.fill;
      const def = PENDING_DAYS.find(d => d.key === key);
      if(!def) return;
      const v = ((document.getElementById('pd-' + key) || {}).value || '').trim();
      if(!v){ toast('先选一个日期'); return; }
      const parts = v.split('-');
      if(def.target === 'profile'){
        S.profile[def.key] = v;              // 她的生日要存完整日期
        save(); render(); toast(def.label + ' 填好了，生日当天会切到作战包');
        return;
      }
      S.profile.days = S.profile.days || [];
      S.profile.days.push({
        id: 'p_' + key, label: def.label, kind: def.kind, lunar: false,
        md: String(parts[1]).padStart(2,'0') + '-' + String(parts[2]).padStart(2,'0')
      });
      save(); render(); toast(def.label + ' 已加入重要日子');
    };
  });
  document.querySelectorAll('[data-check]').forEach(el=>{
    el.onclick = ()=>{
      S.checks = S.checks || {};
      S.checks[el.dataset.check] = !S.checks[el.dataset.check];
      if(S.checks[el.dataset.check]) buzz(8);
      save(); render();
    };
  });
  document.querySelectorAll('[data-theme-pick]').forEach(el=>{
    el.onclick = ()=>{
      S.profile.theme = el.dataset.themePick;
      save(); resolveTheme(); render();
    };
  });
  const live = () => (S.inbox || []).filter(x => !x.used);
  document.querySelectorAll('[data-inbox-pick]').forEach(el=>{
    el.onclick = ()=>{
      const it = live()[+el.dataset.inboxPick]; if(!it) return;
      const c = taskCandidatesFrom(it.text)[+el.dataset.cand]; if(!c || !c.title) return;
      S.profile.custom = S.profile.custom || [];
      S.profile.custom.push(c);
      it.used = true;
      save(); render(); toast('加进任务库了');
    };
  });
  document.querySelectorAll('[data-inbox-own]').forEach(el=>{
    el.onclick = ()=>{
      const it = live()[+el.dataset.inboxOwn]; if(!it) return;
      window.__inboxPrefill = it.text;
      it.used = true; save();
      INBOX = false; TAB = 'more'; render();
      toast('在下面把它写成一条任务');
    };
  });
  document.querySelectorAll('[data-inbox-drop]').forEach(el=>{
    el.onclick = ()=>{
      const it = live()[+el.dataset.inboxDrop]; if(!it) return;
      it.used = true; save(); render();
    };
  });
  document.querySelectorAll('[data-undislike]').forEach(el=>{
    el.onclick = ()=>{
      const i = +el.dataset.undislike;
      S.profile.disliked = (S.profile.disliked||[]);
      S.profile.disliked.splice(i,1);
      save(); render(); toast('撤销了');
    };
  });
}
function handle(act){
  if(act === 'ob-back'){ window.__step = Math.max(0,(window.__step||0)-1); render(); return; }
  if(act === 'ob-next'){ return onboardNext(); }
  if(act === 'reroll'){
    const d = todayStr();
    // 循环：第 3 个再点回到第 1 个（以前是"只前进"，用完就卡在最后一个、回不去）
    S.picks[d].reroll = ((S.picks[d].reroll||0) + 1) % PICK_COUNT;
    save(); render(); return;
  }
  if(act === 'ban'){
    return askWhyNot();
  }
  if(act === 'why-pick'){
    const t = todayPick(); const why = window.__why;
    if(!t.task) return;
    const d = todayStr();
    if(why === '太麻烦'){
      const ladder = [5,15,30,60,999];
      const i = Math.max(0, ladder.indexOf(S.profile.timeBudget||999));
      S.profile.timeBudget = ladder[Math.max(0, i-1)];
      S.picks[d].reroll = ((S.picks[d].reroll||0) + 1) % PICK_COUNT;
      save(); closeSheet(); render(); toast('已把每天可用时间调到 ' + (S.profile.timeBudget===999?'不限':S.profile.timeBudget+' 分钟'));
      return;
    }
    if(why === '她不感兴趣'){
      const tags = (t.task.tags||[]);
      S.profile.disliked = S.profile.disliked || [];
      tags.forEach(tag => { if(S.profile.disliked.indexOf(tag) < 0) S.profile.disliked.push(tag); });
      if(S.banned.indexOf(t.task.id) < 0) S.banned.push(t.task.id);
      save(); closeSheet(); render();
      toast(tags.length ? ('记下了：她不喜欢「'+tags[0]+'」这类，同类不会再出现') : '记下了，这条不再出现');
      return;
    }
    if(why === '今天时机不对'){
      // 只跳过今天：不改她的状态、不永久排除（以前这里会误把"她今天很累"写进去）
      S.skips = S.skips || {};
      S.skips[t.task.id] = (S.skips[t.task.id] || 0) + 1;
      S.picks[d].reroll = ((S.picks[d].reroll||0) + 1) % PICK_COUNT;
      save(); closeSheet(); render(); toast('今天先跳过，明天再说');
      return;
    }
    // 看不懂 → 永久排除；同时提示去改标题
    if(S.banned.indexOf(t.task.id) < 0) S.banned.push(t.task.id);
    S.picks[d].reroll = ((S.picks[d].reroll||0) + 1) % PICK_COUNT;
    save(); closeSheet(); render(); toast('已排除，以后不会再出现');
    return;
  }
  if(act === 'done'){ return askDone(); }
  if(act === 'save-done'){ return saveDone(); }
  if(act === 'story-open'){ return openStorySheet(); }

/* ---------- 导出到手机日历（.ics）——没有服务器也能有提醒 ---------- */
function p2(n){ return String(n).padStart(2,'0'); }
function icsStamp(d){
  return d.getUTCFullYear()+p2(d.getUTCMonth()+1)+p2(d.getUTCDate())+'T'
       + p2(d.getUTCHours())+p2(d.getUTCMinutes())+p2(d.getUTCSeconds())+'Z';
}
function icsEsc(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}
function icsEvent(uid, dateStr, title, desc, alarms, rrule){
  const d = parseDay(dateStr);
  const day = d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate());
  let out = 'BEGIN:VEVENT\r\n'
    + 'UID:'+uid+'\r\n'
    + 'DTSTAMP:'+icsStamp(new Date())+'\r\n'
    + 'DTSTART:'+day+'T090000\r\n'
    + 'DTEND:'+day+'T100000\r\n'
    + 'SUMMARY:'+icsEsc(title)+'\r\n';
  if(desc) out += 'DESCRIPTION:'+icsEsc(desc)+'\r\n';
  if(rrule) out += 'RRULE:'+rrule+'\r\n';
  (alarms||[]).forEach(a=>{
    out += 'BEGIN:VALARM\r\nACTION:DISPLAY\r\nTRIGGER:'+a+'\r\n'
      + 'DESCRIPTION:'+icsEsc(title)+'\r\nEND:VALARM\r\n';
  });
  return out + 'END:VEVENT\r\n';
}
/* 妇女节不导出：有人喜欢被过节，有人反感，不适合默认塞进她的日历 */
const REMIND_FESTIVALS = FESTIVALS.map(f => f.key).filter(k => k !== 'womens');
function buildICS(){
  const today = todayStr();
  const A3 = ['-P7D','-P1D','PT0S'], A1 = ['-P1D'];
  let out = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//OneSmallThing//CN\r\n'
    + 'CALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:'+icsEsc(APP_LABEL)+'\r\n';

  const lunarFest = key => {
    const f = FESTIVALS.find(x => x.key === key);
    if(!f || !f.lunar) return null;
    const base = parseDay(today).getFullYear();
    const list = [];
    for(let k = -1; k <= 4; k++){
      const s = festivalSolarDate(f, base + k);
      if(!s) continue;
      const ds = todayStr(new Date(base + k, s.m - 1, s.d));
      if(ds >= today) list.push(ds);
    }
    return list.slice(0, 3);
  };

  upcomingDays(today, 400).forEach(x => {
    const tip = x.tip || '';
    if(x.kind === 'festival'){
      if(!REMIND_FESTIVALS.includes(x.key)) return;
      const l = lunarFest(x.key);
      if(l){                                   // 农历节日：逐年日期不同，导出未来三次
        l.forEach(ds => { out += icsEvent('tfh-'+x.key+'-'+ds.replace(/-/g,'')+'@todayforher', ds, x.label, tip+'（提前一天提醒）', A1, null); });
      } else {
        out += icsEvent('tfh-'+x.key+'@todayforher', x.date, x.label, tip+'（提前一天提醒）', A1, 'FREQ=YEARLY');
      }
      return;
    }
    if(x.kind === 'quiet'){
      out += icsEvent('tfh-'+x.key+'@todayforher', x.date, x.label+'（今天不安排惊喜）',
        '这天不要安排惊喜和庆祝。安静地陪着，做点实事就好。', A1, x.lunar ? null : 'FREQ=YEARLY');
      return;
    }
    // 她的生日 / 纪念日 / 家人相关的日子：提前 7 天、提前 1 天、当天 09:00 各提醒一次
    const isBday = x.key === 'birthday';
    out += icsEvent('tfh-'+x.key+'@todayforher', x.date, x.label,
      (isBday ? '今天是她的生日。打开「'+APP_LABEL+'」，照着作战包做：早上早起半小时、白天带娃两小时、傍晚三件套、晚上看半场世界杯。'
              : '打开「'+APP_LABEL+'」，看今天的安排。'),
      A3, x.lunar ? null : 'FREQ=YEARLY');
  });
  return out + 'END:VCALENDAR\r\n';
}
function exportICS(){
  const blob = new Blob([buildICS()], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'today-for-her-'+todayStr()+'.ics';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast('已导出，用手机打开导入日历');
}

/* ===== 「让 AI 帮你写一条」：App 只出提示词 + 本地校验，自己不上网 ===== */
/* ===== 素材收件箱 → 任务候选：把"她随口说的话"变成能执行的小事 =====
   设计：捕获与处理分开。捕获只要 5 秒（一句话），处理交给这里给候选。 */
function taskCandidatesFrom(text){
  const t = String(text||'').trim();
  const out = [];
  const add = (title, how, cat, min, cost, tags, flags) => out.push({title, how, cat, min, cost, tags, flags:flags||[]});
  if(!t) return out;

  // ① 想吃 / 好久没吃 / 想吃点什么
  let m = t.match(/(?:想吃|好久没吃|馋|想吃点|想吃一次)\s*([^，。！？!?\s]{2,10})/);
  if(m) add('带她去吃一次'+m[1], '不用问她想不想，直接订位。', '惊喜', 90, 2, ['美食','一起出门'], ['需要外出']);

  // ② 想去 / 想看 / 想逛
  m = t.match(/(?:想去|想看|想逛|好想去|想去看|好久没去)\s*([^，。！？!?\s]{2,12})/);
  if(m){
    const place = m[1];
    if(/展|演出|电影|话剧|音乐会|球/.test(place)) add('订两张'+place+'的票，带她去', '挑她说过的那个，别让她选时间。', '惊喜', 120, 2, ['一起出门','惊喜和仪式感'], ['需要外出']);
    else add('带她去一次'+place, '把亨亨安排好，这天只属于你们俩。', '回忆', 120, 2, ['一起出门'], ['需要外出','涉及亨亨']);
  }

  // ③ 身体不舒服：疼/酸/累/睡不好
  if(/疼|酸|不舒服|累|睡不好|失眠|落枕/.test(t)){
    if(/腰|抱娃|抱孩子/.test(t)) add('今晚的娃我全包，她躺着就行', '夜里也归我，别让她爬起来。', '亲子', 60, 0, ['睡饱觉','独处时间'], ['涉及亨亨']);
    else add('今天家里的事我全接过来，她只管休息', '不用问她想不想被照顾，直接做。', '分担', 30, 0, ['务实省钱'], []);
  }

  // ④ 乱 / 脏 / 该收拾
  m = t.match(/([^，。！？!?\s]{2,6})(?:好乱|太乱|乱|该收拾|没收|堆)/);
  if(m) add('把'+m[1]+'收拾干净，不用她动手', '趁她没注意的时候做完。', '分担', 30, 0, ['干净整洁的家'], []);

  // ⑤ 情绪/压力/委屈
  if(/烦|委屈|压力|崩|不开心|郁闷|生气/.test(t))
    add('今晚不聊娃不聊工作，听她说完', '问一句"今天哪一刻最难熬"，然后只听。', '关注', 15, 0, ['有人陪聊','安静不被打扰'], []);

  // ⑥ 提到具体的人
  m = t.match(/([^，。！？!?\s]{2,4})(?:说|问|找我|找我聊|吐槽)/);
  if(m) add('主动问一句她'+m[1]+'那件事后来怎么样了', '说明你记着她说过的话。', '关注', 10, 0, ['有人陪聊'], []);

  // ⑦ 兜底：把原句交还给"自己写"
  if(!out.length) add('', t, '分担', 15, 0, ['务实省钱'], []);
  // 过一遍她的雷区，命中就丢掉
  return out.filter(x => !(x.title && avoidHit(x.title + ' ' + x.how)));
}

const AVOID_KEYWORDS = {
  '别提身材体重': ['瘦','胖','体重','身材','恢复得'],
  '别提产后':     ['产后','生完','以前不是这样'],
  '别当众表白':   ['朋友圈','发出去','公开'],
  '别评价我的外貌': ['漂亮','好看','气色','年轻','美'],
  '别拿我和别人比': ['别人','人家','你看看'],
  '别只有节日才想起来': []
};
const CATS = ['分担','关注','表达','惊喜','回忆','亲子','独处'];
const FLAGS = ['涉及亨亨','需要外出','需要体力'];
function avoidHit(text){
  const t = String(text||'');
  for(const k in AVOID_KEYWORDS){
    if(!(S.profile.avoid||[]).includes(k)) continue;
    for(const w of AVOID_KEYWORDS[k]){ if(w && t.includes(w)) return k + '（出现「'+w+'」）'; }
  }
  return '';
}
/* 本地校验：AI 给什么都要过这一关，不合规的直接拒 */
function normTask(o){
  const errs = [];
  o = o || {};
  const title = String(o.title||'').trim();
  if(!title) errs.push('缺少 title');
  if(title.length > 30) errs.push('标题超过 30 字');
  const how = String(o.how||'').trim();
  let cat = String(o.cat||'分担'); if(!CATS.includes(cat)) cat = '分担';
  let min = Number(o.min); if(!isFinite(min) || min < 0 || min > 240) min = 15;
  let cost = Number(o.cost); if(![0,1,2].includes(cost)) cost = 0;
  let tags = (Array.isArray(o.tags) ? o.tags : []).filter(x => LIKES.includes(x));
  let flags = (Array.isArray(o.flags) ? o.flags : []).filter(x => FLAGS.includes(x));
  let note = '';
  const hit = avoidHit(title + ' ' + how);
  if(hit) errs.push('命中她的雷区：' + hit);
  if((S.profile.avoid||[]).includes('别乱花钱') && cost > 0){ cost = 0; note = '（她说别乱花钱，已把花费改成 0）'; }
  if(/^帮/.test(title)) note += '（建议去掉"帮"字：本来就是该做的）';
  return { errs: errs, note: note, task: { title:title, how:how, cat:cat, min:min, cost:cost, tags:tags, flags:flags } };
}
function buildAiPrompt(raw){
  const avoid = (S.profile.avoid||[]);
  return [
    '你是帮我给妻子写"每天一件小事"的助手。它每天提醒我做一件具体的小事，要求：',
    '',
    '写作规则：',
    '1. 标题是动词短语，不超过 24 个字，说清"做什么"，不要抽象（不要"多关心她"）',
    '2. 不要求她做决定、不要求她回应、不需要她配合（不要"问她今天想吃什么"）',
    '3. 时长要诚实；宁可小到 5 分钟能做完',
    '4. 不出现"帮她"这个词（本来就是该我做的）',
    avoid.length ? ('5. 绝对不要碰这些：' + avoid.join('、')) : '5. 不要评价外貌、不要提身材体重',
    '',
    '我的素材（把她/我们的情况写成了任务）：',
    '「' + raw + '」',
    '',
    '请输出 JSON 数组（只输出 JSON，不要解释、不要代码块标记），每项格式：',
    '[{"title":"今晚的碗我洗，她不许进厨房","how":"吃完就收，别等她开口。",' +
      '"cat":"分担","min":15,"cost":0,"tags":["干净整洁的家"],"flags":["涉及亨亨"]}]',
    '',
    '字段取值限制：',
    'cat 只能是：' + CATS.join(' / '),
    'tags 只能从这些里选（可空数组）：' + LIKES.join(' / '),
    'flags 只能从这些里选（可空数组）：' + FLAGS.join(' / '),
    'min 是 0~240 的整数；cost 是 0(不花钱) / 1(小额) / 2(不限)',
    '',
    '一次给 1~3 条。'
  ].join('\n');
}

function openAiImportSheet(prompt){
  let copied = '已复制到剪贴板，直接粘给 AI';
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(prompt); }
    else copied = '长按下面的文字全选复制';
  }catch(e){ copied = '长按下面的文字全选复制'; }
  openSheet(
    '<h2>1 · 把这段发给 AI</h2>'
    + '<div class="muted" style="margin-bottom:10px">'+copied+'</div>'
    + '<textarea id="ai-prompt" style="min-height:150px;font-size:12.5px">'+esc(prompt)+'</textarea>'
    + '<h2 style="margin-top:6px">2 · 把 AI 的结果粘回来</h2>'
    + '<div class="muted" style="margin-bottom:10px">不支持、或者写得不合规的，App 会当场挡下来。</div>'
    + '<textarea id="ai-back" style="min-height:100px;font-size:12.5px" placeholder=\'[{"title":"…","how":"…","cat":"分担","min":15,"cost":0,"tags":[],"flags":[]}]\'></textarea>'
    + '<button class="btn primary" id="ai-import">导入</button>'
    + '<button class="btn text" id="ai-cancel2">取消</button>'
  );
  document.getElementById('ai-cancel2').onclick = closeSheet;

    const t = ((document.getElementById('ai-back')||{}).value||'').trim();
    if(!t){ toast('还没粘呢'); return; }
    const r = importTasks(t);
    if(r.added){
      closeSheet(); render();
      toast('加了 '+r.added+' 条'+(r.rejected? ('，挡下 '+r.rejected+' 条'):''));
    } else {
      openSheet('<h2>都没通过校验</h2>'
        + '<div class="muted" style="margin-bottom:12px">下面这些不能进任务库（这层校验在本地做，就是为了防止踩到她的雷区）：</div>'
        + '<div class="why">'+esc(r.reasons.join('；'))+'</div>'
        + '<button class="btn ghost" id="ai-back2" style="margin-top:14px">重新粘一次</button>');
      document.getElementById('ai-back2').onclick = openAiSheet;
    }
  };
}
function importTasks(text){
  let s = String(text||'').trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  let data;
  try{ data = JSON.parse(s); }catch(e){ return {added:0, rejected:1, reasons:['不是合法 JSON']}; }
  const list = Array.isArray(data) ? data : [data];
  let added = 0, rejected = 0; const reasons = [];
  list.forEach(o => {
    const r = normTask(o);
    if(r.errs.length){ rejected++; reasons.push('「'+String((o&&o.title)||'（无标题）').slice(0,14)+'」：'+r.errs.join('、')); return; }
    S.profile.custom = S.profile.custom || [];
    S.profile.custom.push(r.task);
    added++;
    if(r.note) toast(r.note);
  });
  save();
  return { added:added, rejected:rejected, reasons:reasons };
}
