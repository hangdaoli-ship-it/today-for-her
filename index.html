<style>
  :root{
    --bg:#FFF7F2;
    --card:#FFFFFF;
    --ink:#3B322C;
    --ink-2:#7A6E66;
    --ink-3:#A99C93;
    --line:#F0E4DA;
    --accent:#E4795F;
    --accent-soft:#FDECE6;
    --accent-2:#C9A227;
    --good:#5B9A7E;
    --shadow:0 6px 22px rgba(180,140,120,.13);
    --radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
  .scroll{flex:1;overflow-y:auto;padding:0 18px calc(96px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .topbar{padding:calc(20px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .topbar h1{margin:0;font-size:23px;letter-spacing:.5px;font-weight:600}
  .topbar .sub{font-size:12.5px;color:var(--ink-3);letter-spacing:.4px}
  .heart{font-size:20px;transform:translateY(2px)}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:14px;border:1px solid rgba(240,228,218,.7)}
  .card.flat{box-shadow:none;border:1px dashed var(--line);background:transparent}
  h2{font-size:16px;margin:0 0 10px;font-weight:600}
  h3{font-size:14px;margin:0 0 8px;font-weight:600;color:var(--ink-2)}
  .muted{color:var(--ink-3);font-size:13px}
  .tag{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:#B85B44;margin:0 6px 6px 0;white-space:nowrap}
  .tag.grey{background:#F3EEE9;color:var(--ink-2)}
  .tag.green{background:#E9F4EE;color:#3F7A61}
  .btn{display:block;width:100%;border:none;border-radius:16px;padding:15px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .12s ease,filter .12s ease}
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(228,121,95,.32)}
  .btn.ghost{background:#F5EDE7;color:var(--ink-2);font-weight:500}
  .btn.text{background:none;color:var(--ink-3);font-weight:500;font-size:14px;padding:10px}
  .btn.danger{background:#FDECE9;color:#C0503A}
  .row{display:flex;gap:10px}
  .row>*{flex:1}

  /* 今日卡 */
  .today-card{background:linear-gradient(160deg,#FFFFFF 0%,#FFF3EC 100%);border:1px solid #F6E1D6}
  .today-cat{font-size:12px;color:#C1735A;letter-spacing:2px;margin-bottom:10px}
  .today-title{font-size:24px;line-height:1.42;font-weight:600;letter-spacing:.2px;margin:0 0 12px}
  .today-how{font-size:14.5px;color:var(--ink-2);margin:0 0 14px;padding-left:12px;border-left:3px solid var(--accent-soft)}
  .meta{display:flex;flex-wrap:wrap;gap:6px 0;margin-bottom:12px}
  .why{font-size:13.5px;color:#8A6A58;background:#FFF9F5;border-radius:14px;padding:11px 13px;line-height:1.55}
  .daycount{text-align:center;font-size:13px;color:var(--ink-3);margin:4px 0 18px}
  .moodpills{display:flex;gap:8px}
  .mood{flex:1;text-align:center;padding:9px 0;border-radius:14px;background:#F5EDE7;color:var(--ink-2);font-size:14px;cursor:pointer;border:1.5px solid transparent;transition:.15s}
  .mood.on{background:var(--accent-soft);border-color:#F0BCAA;color:#B85B44;font-weight:600}

  /* 底部导航 */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
    background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;
    padding-bottom:env(safe-area-inset-bottom);z-index:30
  }
  .tab{flex:1;padding:9px 0 8px;text-align:center;cursor:pointer;color:var(--ink-3);font-size:11.5px;letter-spacing:.5px}
  .tab.on{color:var(--accent)}
  .tab svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* 弹层 */
  .sheet{position:fixed;inset:0;background:rgba(59,50,44,.42);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .sheet.on{display:flex}
  .sheet-inner{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
  textarea,input[type=text],input[type=date],select{
    width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15.5px;
    font-family:inherit;color:var(--ink);background:#FFFDFB;outline:none;margin-bottom:12px
  }
  textarea:focus,input:focus{border-color:#F0BCAA}
  textarea{min-height:86px;resize:none;line-height:1.6}
  label{display:block;font-size:13.5px;color:var(--ink-2);margin:0 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .chip{padding:9px 14px;border-radius:999px;background:#F5EDE7;color:var(--ink-2);font-size:14px;cursor:pointer;border:1.5px solid transparent;transition:.15s}
  .chip.on{background:var(--accent-soft);border-color:#F0BCAA;color:#B85B44;font-weight:600}
  .chk{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;background:#FBF6F2;
       margin-bottom:8px;font-size:14.5px;line-height:1.5;cursor:pointer;transition:.15s}
  .chk.on{background:#EFF6F1;color:#4A6B5A;text-decoration:none}
  .chk .box{flex:0 0 20px;height:20px;border-radius:7px;border:1.5px solid #E2D3C8;background:#fff;
            display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px;transition:.15s}
  .chk.on .box{background:#7BAE95;border-color:#7BAE95}
  .chk.on div{text-decoration:line-through;text-decoration-color:#B9CFC2}

  /* 引导 */
  .onboard{padding:calc(40px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
  .dots{display:flex;gap:5px;margin:0 auto 26px}
  .dot{width:7px;height:7px;border-radius:50%;background:#EEE1D7}
  .dot.on{background:var(--accent);width:18px;border-radius:4px}
  .onboard h2{font-size:21px;line-height:1.5;margin:0 0 8px}
  .onboard .lead{font-size:14px;color:var(--ink-3);margin:0 0 22px}
  .grow{flex:1}
  .big-hello{font-size:26px;line-height:1.55;font-weight:600;margin:0 0 14px}

  /* 记录 */
  .stat{text-align:center;padding:16px 8px}
  .stat .n{font-size:27px;font-weight:600;color:var(--accent);line-height:1.2}
  .stat .l{font-size:12px;color:var(--ink-3);margin-top:2px}
  .tl{position:relative;padding-left:18px}
  .tl:before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1.5px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 18px}
  .tl-item:before{content:"";position:absolute;left:-18px;top:7px;width:9px;height:9px;border-radius:50%;background:#F3C6B6;border:2px solid #fff;box-shadow:0 0 0 2px #FBEFE8}
  .tl-date{font-size:12px;color:var(--ink-3);letter-spacing:.3px}
  .tl-title{font-size:15px;font-weight:600;margin:1px 0 3px}
  .tl-note{font-size:13.5px;color:var(--ink-2)}
  .tl-note:before{content:"“"}.tl-note:after{content:"”"}

  /* 分享卡 */
  .share-card{background:linear-gradient(165deg,#FFFDFB,#FFF1E9);border-radius:20px;padding:26px 22px;border:1px solid #F6E1D6;position:relative;overflow:hidden}
  .share-card .wm{position:absolute;right:-16px;bottom:-24px;font-size:110px;opacity:.06}
  .share-card .d{font-size:12px;color:var(--ink-3);letter-spacing:2px}
  .share-card .t{font-size:21px;font-weight:600;line-height:1.5;margin:10px 0}
  .share-card .f{font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:10px;margin-top:14px}

  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(59,50,44,.9);color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
  .toast.on{opacity:1;bottom:120px}
  .fade{animation:fade .3s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .confetti{position:fixed;top:-10px;width:8px;height:14px;border-radius:2px;opacity:.9;animation:fall linear forwards;z-index:60;pointer-events:none}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid #F7EFE9;font-size:14.5px}
  .kv:last-child{border-bottom:none}
  .kv .v{font-weight:600}
</style>
</head>

function leapMonth(y){ return LUNAR_INFO[y - 1900] & 0xf; }
function leapDays(y){ return leapMonth(y) ? ((LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29) : 0; }
function monthDays(y,m){ return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
function lunarYearDays(y){
  let sum = 348;
  for(let i = 0x8000; i > 0x8; i >>= 1){ sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0; }
  return sum + leapDays(y);
}
function solarToLunar(y, m, d){
  let offset = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000);
  let i, temp = 0;
  for(i = 1900; i < 2050 && offset > 0; i++){ temp = lunarYearDays(i); offset -= temp; }
  if(offset < 0){ offset += temp; i--; }
  const year = i;
  const leap = leapMonth(year);
  let isLeap = false, j;
  for(j = 1; j < 13 && offset > 0; j++){
    if(leap > 0 && j === leap + 1 && !isLeap){ --j; isLeap = true; temp = leapDays(year); }
    else { temp = monthDays(year, j); }
    if(isLeap && j === leap + 1) isLeap = false;
    offset -= temp;
  }
  if(offset === 0 && leap > 0 && j === leap + 1){
    if(isLeap){ isLeap = false; } else { isLeap = true; --j; }
  }
  if(offset < 0){ offset += temp; --j; }
  return { year, month: j, day: offset + 1, isLeap };
}
/* 农历 (月, 日) → 公历年内的公历日期；找不到返回 null */
const _lunarCache = {};
function lunarToSolar(ly, lm, ld){
  const key = ly + '-' + lm + '-' + ld;
  if(key in _lunarCache) return _lunarCache[key];
  let found = null;
  const start = Date.UTC(ly, 0, 20);
  for(let i = 0; i < 400; i++){
    const t = new Date(start + i * 86400000);
    const Y = t.getUTCFullYear(), M = t.getUTCMonth() + 1, D = t.getUTCDate();
    const l = solarToLunar(Y, M, D);
    if(l.year === ly && l.month === lm && l.day === ld && !l.isLeap){ found = { y: Y, m: M, d: D }; break; }
  }
  _lunarCache[key] = found;
  return found;
}

function nthWeekdayOfMonth(y, m, weekday, nth){
  const first = new Date(y, m - 1, 1);
  const shift = (weekday - first.getDay() + 7) % 7;
  return 1 + shift + (nth - 1) * 7;
}
/* 某年某节日对应的公历日期（MM-DD），返回 null 表示该年算不出来 */
function festivalSolarDate(f, year){
  if(f.day) return { m: f.month, d: f.day };
  if(f.nth !== undefined){
    const d = nthWeekdayOfMonth(year, f.month, f.weekday, f.nth);
    return { m: f.month, d };
  }
  if(f.lunar){
    const s = lunarToSolar(year, f.lunar[0], f.lunar[1]);
    return s ? { m: s.m, d: s.d } : null;
  }
  return null;
}
function mdOf(dateStr){ const d = parseDay(dateStr); return { m: d.getMonth()+1, d: d.getDate() }; }
function nextSolarMMDD(dateStr, m, d){
  const t = parseDay(dateStr);
  let y = t.getFullYear();
  if(t > new Date(y, m - 1, d)) y += 1;
  return { date: todayStr(new Date(y, m - 1, d)), year: y };
}
/* 自定义重要日子 → 下一次出现的公历日期 */
function nextCustomDate(dateStr, day){
  const t = parseDay(dateStr);
  const [m, d] = day.md.split('-').map(Number);
  if(!day.lunar) return nextSolarMMDD(dateStr, m, d);
  for(let k = 0; k < 2; k++){
    const s = lunarToSolar(t.getFullYear() + k, m, d);
    if(!s) continue;
    const ds = todayStr(new Date(s.y, s.m - 1, s.d));
    if(daysBetween(dateStr, ds) >= 0) return { date: ds, year: s.y };
  }
  return null;
}
/* 未来一段时间的全部重要日子（节日 + 她的生日/纪念日 + 自定义） */
function upcomingDays(dateStr, horizon){
  horizon = horizon || 400;
  const t = parseDay(dateStr);
  const out = [];
  const push = (label, ds, meta) => {
    if(!ds) return;
    const dd = daysBetween(dateStr, ds);
    if(dd < 0 || dd > horizon) return;
    out.push(Object.assign({ label, date: ds, days: dd }, meta || {}));
  };
  // 节日：跨两年查，覆盖春节/元宵落在年初的情况
  [t.getFullYear(), t.getFullYear() + 1].forEach(y => {
    FESTIVALS.forEach(f => {
      const s = festivalSolarDate(f, y);
      if(!s) return;
      push(f.label, todayStr(new Date(y, s.m - 1, s.d)), { kind:'festival', key:f.key, tip:f.tip });
    });
  });
  const p = S.profile;
  if(p.birthday){ const s = mdOf(p.birthday), n = nextSolarMMDD(dateStr, s.m, s.d); push(p.name + '的生日', n.date, { kind:'birthday', key:'birthday' }); }
  if(p.anniversary){ const s = mdOf(p.anniversary), n = nextSolarMMDD(dateStr, s.m, s.d); push('结婚纪念日', n.date, { kind:'anniversary', key:'anniversary' }); }
  (p.days || []).forEach(day => {
    const n = nextCustomDate(dateStr, day);
    if(n) push(day.label, n.date, { kind: day.kind, key: day.id, lunar: !!day.lunar });
  });
  out.sort((a, b) => a.days - b.days || (a.label > b.label ? 1 : -1));
  // 同一天多个节日只保留第一个（避免重复提示）
  const seen = {};
  return out.filter(x => { const k = x.date + '|' + x.kind; if(seen[k]) return false; seen[k] = 1; return true; });
}
/* 今天的情境：今天是什么日子、哪些日子临近、是否需要安静 */
function dayContext(dateStr){
  const list = upcomingDays(dateStr, 8);
  const today = list.filter(x => x.days === 0);
  const prep = list.filter(x => x.days > 0 && x.days <= 7);
  const quiet = today.some(x => x.kind === 'quiet');
  return { list, today, prep, quiet };
}

}
function parseDay(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function daysBetween(a,b){ return Math.round((parseDay(b)-parseDay(a))/86400000); }

/* ---------- 4. 推荐引擎 ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rnd = mulberry32(seed), a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function lastDoneIndex(){
  const m = {};
  S.done.forEach(r=>{ const g = daysBetween(r.date, todayStr()); if(m[r.id]===undefined || g < m[r.id]) m[r.id] = g; });
  return m;
}
function specialKind(date){
  const p = S.profile, d = parseDay(date), md = [d.getMonth()+1, d.getDate()].join('-');
  if(p.birthday && [parseDay(p.birthday).getMonth()+1, parseDay(p.birthday).getDate()].join('-') === md) return 'birthday';
  if(p.anniversary && [parseDay(p.anniversary).getMonth()+1, parseDay(p.anniversary).getDate()].join('-') === md) return 'anniversary';
  if(p.babyBirthday){
    const b = parseDay(p.babyBirthday), months = (d.getFullYear()-b.getFullYear())*12 + (d.getMonth()-b.getMonth());
    if(d.getDate()===b.getDate() && months>0 && months<=36) return 'babymonth';
  }
  return null;
}
function candidates(date, ctx){
  const mood = S.mood[date] || '一般';
  const {timeBudget, costBudget, avoid, stage} = S.profile;
  const recent = lastDoneIndex();
  const maxMin = mood === '很累' ? Math.min(timeBudget||999, 30) : (timeBudget || 999);
  ctx = ctx || dayContext(date);

  // 专属日任务：节日前后 7 天内、以及重要日子临近时的准备任务
  const extra = [];
  if(!ctx.quiet){
    ctx.list.filter(x => x.days <= 7).forEach(x => {
      if(x.kind === 'festival') FEST_LIB.forEach(t => { if(t.fest.includes(x.key)) extra.push(t); });
    });
    if(ctx.prep.length || ctx.today.length) PREP_LIB.forEach(t => extra.push(t));
  }
  const seenId = {};
  const pool = library().concat(extra).filter(t => { if(seenId[t.id]) return false; seenId[t.id] = 1; return true; });

  // 安静日：不推任何"制造惊喜"的任务，只留下能做的那类
  const quietBan = ['惊喜','表达','回忆'];

  return pool.filter(t=>{
    if(S.banned.includes(t.id)) return false;
    if(recent[t.id] !== undefined && recent[t.id] < 14) return false;
    if(t.min > maxMin) return false;
    if(t.cost > costBudget) return false;
    if(avoid.includes('别乱花钱') && t.cost > 0) return false;
    if(stage === '产后恢复期' && (t.flags.includes('需要外出') || t.flags.includes('需要体力'))) return false;
    if(t.flags.includes('需要她配合')) return false;
    if(ctx.quiet && quietBan.includes(t.cat)) return false;
    return true;
  });
}
function scoreOf(t, date, ctx){
  const mood = S.mood[date] || '一般';
  const sp = specialKind(date);
  ctx = ctx || dayContext(date);
  const recent = lastDoneIndex();
  let s = 1.0, reasons = [];

  const hitLikes = t.tags.filter(x=>S.profile.likes.includes(x));
  s += 2.0 * hitLikes.length;
  if(hitLikes.length) reasons.push('你喜欢的方式里有「'+hitLikes[0]+'」');

  const hitAvoid = t.tags.filter(x=>S.profile.avoid.includes(x));
  s -= 3.0 * hitAvoid.length;

  s += (CAT_META[t.cat] ? CAT_META[t.cat].moodWeights[mood] : 0);

  if(mood === '很累' && ['分担','独处','亲子'].includes(t.cat)) reasons.push('她说今天很累，先把事接过来最有用');
  if(mood === '很好' && ['回忆','惊喜','表达'].includes(t.cat)) reasons.push('她今天状态不错，可以做点有仪式感的');

  if(sp === 'birthday' && ['惊喜','回忆','表达'].includes(t.cat)){ s += 4.0; reasons.push('今天是她的生日'); }
  if(sp === 'anniversary' && ['回忆','表达'].includes(t.cat)){ s += 4.0; reasons.push('今天是你们的纪念日'); }
  if(sp === 'babymonth' && t.flags.includes('涉及亨亨')){ s += 4.0; reasons.push('亨亨今天满月龄，拍点东西留下来'); }

  const g = recent[t.id];
  if(g !== undefined){ if(g>=31) { s += 1.0; } else if(g>=15) { s += 0.5; } }

  if(S.profile.stage === '产后恢复期' && t.flags.includes('需要体力')) s -= 2.0;
  if(S.profile.stage === '哺乳期' && t.flags.includes('需要外出')) s -= 1.0;

  // 节日当天 / 临近
  if(t.fest){
    const now = ctx.today.find(x => x.kind === 'festival' && t.fest.includes(x.key));
    const near = ctx.list.find(x => x.kind === 'festival' && t.fest.includes(x.key));
    if(now){ s += 5.0; reasons.unshift('今天是' + now.label); }
    else if(near){ s += 2.0; reasons.unshift(near.label + '还有 ' + near.days + ' 天'); }
  }
  // 重要日子前的准备
  if(t.prep){
    const nx = ctx.prep[0] || ctx.today[0];
    if(nx){
      s += 3.0 + (t.pri || 0) * 0.6;
      reasons.unshift(nx.days === 0 ? ('今天就是' + nx.label) : ('距离' + nx.label + '还有 ' + nx.days + ' 天，先准备'));
    }
  }
  if(ctx.quiet) reasons.unshift('今天不适合搞惊喜，安静地做点实事');

  if(!reasons.length){
    reasons.push(t.cat === '分担' ? '今天能替她省一件心' : '换一种方式让她知道你在');
  }
  return {s, reasons};
}
function pick(date, reroll){
  const ctx = dayContext(date);
  const cands = candidates(date, ctx);
  if(!cands.length) return {task:null, why:'任务库今天没有合适的了，去「更多」里加一条专属的。'};
  const scored = cands.map(t=>{ const r = scoreOf(t, date, ctx); return {t, s:r.s, reasons:r.reasons}; })
                      .sort((a,b)=> b.s - a.s);
  // 取分数最高的前 8 条，再用"当天日期"作种子的抖动排序：
  // 分数决定大体顺序（今天最该做的那件排前面），抖动带来变化（不会每天都是同一件）。
  const top = scored.slice(0, Math.min(8, scored.length));
  const seed = parseInt(date.replace(/-/g,''),10) || 20261007;
  const rnd = mulberry32(seed);
  const ranked = top.map(x => ({ t: x.t, why: x.reasons, k: x.s + rnd() * 0.9 }))
                    .sort((a,b)=> b.k - a.k);
  const idx = Math.min(reroll||0, ranked.length-1);
  const chosen = ranked[idx];
  return {task:chosen.t, why:(chosen.why || []).slice(0,2).join('，')};
}
function todayPick(){
  const d = todayStr();
  if(!S.picks[d]) S.picks[d] = {reroll:0};
  const p = pick(d, S.picks[d].reroll);
  return {date:d, ...p, reroll:S.picks[d].reroll};
}

function fmtDate(s){
  const d = parseDay(s), w = ['日','一','二','三','四','五','六'][d.getDay()];
  return (d.getMonth()+1)+' 月 '+d.getDate()+' 日 · 周'+w;
}
function fmtShort(s){
  const d = parseDay(s);
  return (d.getMonth()+1)+' 月 '+d.getDate()+' 日';
}
function nextOccur(dateStr){
  if(!dateStr) return null;
  const t = parseDay(todayStr()), o = parseDay(dateStr);
  let next = new Date(t.getFullYear(), o.getMonth(), o.getDate());
  if(daysBetween(todayStr(), todayStr(next)) < 0) next = new Date(t.getFullYear()+1, o.getMonth(), o.getDate());
  return {days: daysBetween(todayStr(), todayStr(next)), md:(o.getMonth()+1)+' 月 '+o.getDate()+' 日'};
}
function yearsSince(dateStr){
  if(!dateStr) return 0;
  const a = parseDay(dateStr), t = parseDay(todayStr());
  let y = t.getFullYear() - a.getFullYear();
  if(t.getMonth() < a.getMonth() || (t.getMonth() === a.getMonth() && t.getDate() < a.getDate())) y -= 1;
  return Math.max(0, y);
}

function nextStoryQ(){
  const st = S.story || (S.story = {answers:{}, skipped:[], on:{}});
  st.answers = st.answers || {}; st.skipped = st.skipped || [];
  let q = STORY_ALL.find(x => !st.answers[x.id] && !st.skipped.includes(x.id));
  if(!q){
    const left = STORY_ALL.filter(x => !st.answers[x.id]);
    if(left.length){ st.skipped = []; q = left[0]; }
  }
  return q || null;
}
function storyProgress(){
  const a = (S.story && S.story.answers) || {};
  return { done: STORY_ALL.filter(x => a[x.id]).length, total: STORY_ALL.length };
}
function streak(){
  const days = new Set(S.done.map(r=>r.date));
  let n = 0, cur = new Date();
  if(!days.has(todayStr(cur))) cur.setDate(cur.getDate()-1);
  while(days.has(todayStr(cur))){ n++; cur.setDate(cur.getDate()-1); }
  return n;
}
function last7(){
  const out = [];
  for(let i=0;i<7;i++){ const d = new Date(); d.setDate(d.getDate()-i); out.push(todayStr(d)); }
  return S.done.filter(r=>out.includes(r.date)).length;
}

    + '<div class="stat"><div class="n">'+total+'</div><div class="l">件小事</div></div>'
    + '<div class="stat"><div class="n">'+streak()+'</div><div class="l">天没有断</div></div>'
    + '<div class="stat"><div class="n">'+last7()+'</div><div class="l">近 7 天</div></div>'
    + '</div></div>';
  const first = S.done.map(r=>r.date).sort()[0];
  html += '<div class="card flat"><div class="muted">从 '+fmtShort(first)+' 开始，到今天一共 '+(daysBetween(first,todayStr())+1)+' 天。</div></div>';
  html += Object.keys(byDate).map(date=>'<div class="card"><div class="tl">'
    + byDate[date].map(r=>'<div class="tl-item">'
        + '<div class="tl-date">'+fmtDate(date)+' · '+esc(r.cat||'')+'</div>'
        + '<div class="tl-title">'+esc(r.title)+'</div>'
        + (r.note?'<div class="tl-note">'+esc(r.note)+'</div>':'')
        + (r.react?'<div class="muted" style="margin-top:2px">'+esc(r.react)+'</div>':'')
      + '</div>').join('')
    + '</div></div>').join('');
  return html;
}

function viewHer(){

  const sp2 = storyProgress();

  html += '<div class="card"><h3>你们的过去 · '+sp2.done+' / '+sp2.total+'</h3>';
  if(q){
    html += '<div class="muted" style="margin-bottom:10px">一次只问一个，随时可以跳过。答完可以顺手把它变成一件小事。</div>'
      + '<div class="why" style="margin-bottom:12px">'+esc(q.q)+'</div>'
      + '<button class="btn ghost" data-act="story-open">回答这个问题</button>';
  } else {
    html += '<div class="muted">都答完了。这些答案会一直留在这一页，也会继续变成新的专属任务。</div>';
  }
  const answered = STORY_ALL.filter(x => S.story.answers[x.id]);
  if(answered.length){
    html += '<div class="divider"></div>';
    let lastStage = '';
    answered.forEach(x => {
      if(x.stage !== lastStage){
        lastStage = x.stage;
        html += '<div class="muted" style="margin:10px 0 4px;font-size:11.5px;letter-spacing:3px">'+esc(x.stage)+'</div>';

        + '<div style="font-size:14.5px">'+esc(S.story.answers[x.id])+'</div></div>';
    });
  }
  html += '</div>';

  html += '<button class="btn ghost" data-act="edit-profile">改一下她的画像</button>';
  return html;
}

function pendingDaysCard(){
  // 已经填过就不要再催：既认「点过填上」的，也认预置/手动加的（按标签匹配）
  const filled = d => d.target === 'profile'
    ? !!S.profile[d.key]
    : (S.profile.days || []).some(x => x.id === 'p_' + d.key || x.label === d.label);
  const left = PENDING_DAYS.filter(d => !filled(d));

  return '<div class="card" style="border-color:#F1DFD4;background:#FFFCF9">'
    + '<h3>还差 '+left.length+' 个日期</h3>'

/* ---------- 7. 交互 ---------- */
function bind(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ TAB = el.dataset.tab; render(); window.scrollTo(0,0); };
  });
  document.querySelectorAll('[data-mood]').forEach(el=>{
    el.onclick = ()=>{ S.mood[todayStr()] = el.dataset.mood; save(); render(); };
  });
  document.querySelectorAll('[data-act]').forEach(el=>{
    el.onclick = ()=> handle(el.dataset.act);
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=>{
      S.profile.days = (S.profile.days || []).filter(x => x.id !== el.dataset.del);
      save(); render(); toast('已删除');
    };
  });
  document.querySelectorAll('[data-fill]').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.fill;
      const def = PENDING_DAYS.find(d => d.key === key);
      if(!def) return;
      const v = ((document.getElementById('pd-' + key) || {}).value || '').trim();
      if(!v){ toast('先选一个日期'); return; }
      const parts = v.split('-');
      if(def.target === 'profile'){
        S.profile[def.key] = v;              // 她的生日要存完整日期
        save(); render(); toast(def.label + ' 填好了，生日当天会切到作战包');
        return;
      }
      S.profile.days = S.profile.days || [];
      S.profile.days.push({
        id: 'p_' + key, label: def.label, kind: def.kind, lunar: false,
        md: String(parts[1]).padStart(2,'0') + '-' + String(parts[2]).padStart(2,'0')
      });
      save(); render(); toast(def.label + ' 已加入重要日子');
    };
  });
  document.querySelectorAll('[data-check]').forEach(el=>{
    el.onclick = ()=>{
      S.checks = S.checks || {};
      S.checks[el.dataset.check] = !S.checks[el.dataset.check];
      save(); render();
    };
  });
}
function handle(act){
  if(act === 'ob-back'){ window.__step = Math.max(0,(window.__step||0)-1); render(); return; }
  if(act === 'ob-next'){ return onboardNext(); }
  if(act === 'reroll'){
    const d = todayStr();
    if((S.picks[d].reroll||0) >= 2){ toast('今天就先这一件吧'); return; }
    S.picks[d].reroll = (S.picks[d].reroll||0)+1; save(); render(); return;
  }
  if(act === 'ban'){
    const t = todayPick();
    if(t.task && !S.banned.includes(t.task.id)) S.banned.push(t.task.id);
    const d = todayStr();
    if((S.picks[d].reroll||0) < 2) S.picks[d].reroll = (S.picks[d].reroll||0)+1;
    save(); toast('已排除这件事'); render(); return;
  }
  if(act === 'done'){ return askDone(); }
  if(act === 'save-done'){ return saveDone(); }
  if(act === 'story-open'){ return openStorySheet(); }
  if(act === 'story-save'){ return saveStory(); }
  if(act === 'edit-bday-msg'){
    openSheet(
      '<h2>留给她的话</h2>'
      + '<div class="muted" style="margin-bottom:12px">生日当天显示在首页最上面。写你自己的话，别用模板。</div>'
      + '<textarea id="bday-msg" style="min-height:140px">'+esc(S.profile.bdayMessage || BIRTHDAY_PACK.message)+'</textarea>'
      + '<button class="btn primary" id="bday-save">保存</button>'
      + '<button class="btn text" id="bday-cancel">取消</button>'
    );
    document.getElementById('bday-save').onclick = ()=>{
      const v = ((document.getElementById('bday-msg') || {}).value || '').trim();
      if(!v){ toast('写一句吧'); return; }
      S.profile.bdayMessage = v; save(); closeSheet(); render(); toast('改好了');
    };
    document.getElementById('bday-cancel').onclick = closeSheet;
    return;
  }
  if(act === 'pick-bday-msg'){
    openSheet(
      '<h2>选一句</h2>'
      + '<div class="muted" style="margin-bottom:14px">都是从你们自己的事里写的。选一句，或者点「自己写」。</div>'
      + BIRTHDAY_MESSAGES.map((m,i)=>
          '<div class="chk" data-bmsg="'+i+'"><div>'
          + '<div style="font-size:11.5px;color:#A99C93;letter-spacing:1.5px;margin-bottom:4px">'+esc(m.tag)
          + (m.warn ? ' · 她不愿提那段就选别的' : '') + '</div>'
          + '<div>'+esc(m.text)+'</div></div></div>').join('')
      + '<div style="height:6px"></div>'
      + '<button class="btn ghost" id="bmsg-own">我自己写</button>'
      + '<button class="btn text" id="bmsg-cancel">取消</button>'
    );
    document.querySelectorAll('[data-bmsg]').forEach(el=>{
      el.onclick = ()=>{
        S.profile.bdayMessage = BIRTHDAY_MESSAGES[+el.dataset.bmsg].text;
        save(); closeSheet(); render(); toast('换好了，还可以再改');
      };
    });
    document.getElementById('bmsg-own').onclick = ()=>{ closeSheet(); handle('edit-bday-msg'); };
    document.getElementById('bmsg-cancel').onclick = closeSheet;
    return;
  }
  if(act === 'edit-profile'){
    const p = S.profile;
    ob.name = (p.name === '她' ? '' : p.name);
    ob.birthday = p.birthday || ''; ob.anniversary = p.anniversary || ''; ob.babyBirthday = p.babyBirthday || '';
    ob.timeBudget = p.timeBudget || 30; ob.costBudget = p.costBudget == null ? 2 : p.costBudget;
    ob.likes = (p.likes || []).slice(); ob.avoid = (p.avoid || []).slice(); ob.stage = p.stage || '带娃期';
    window.__step = 0; S.onboarded = false; render(); return;
  }
  if(act === 'export'){ return exportData(); }
  if(act === 'export-ics'){ return exportICS(); }
  if(act === 'share'){ return shareCard(); }
  if(act === 'add-custom'){
    const el = document.getElementById('custom-title'); const v = el ? el.value.trim() : '';
    if(!v){ toast('先写点什么'); return; }
    S.profile.custom = S.profile.custom || []; S.profile.custom.push({title:v, min:15, cost:0});
    save(); toast('已加进任务库'); render(); return;
  }
  if(act === 'add-day'){
    const label = ((document.getElementById('day-label')||{}).value || '').trim();
    const datev = ((document.getElementById('day-date')||{}).value || '').trim();
    const kind = ((document.getElementById('day-kind')||{}).value || 'anniversary');
    const lunar = !!(document.getElementById('day-lunar')||{}).checked;
    if(!label || !datev){ toast('标签和日期都要填'); return; }
    const parts = datev.split('-');
    S.profile.days = S.profile.days || [];
    S.profile.days.push({
      id: 'd' + Date.now(), label: label, kind: kind, lunar: lunar,
      md: String(parts[1]).padStart(2,'0') + '-' + String(parts[2]).padStart(2,'0')
    });
    save(); toast('已加入重要日子'); render(); return;
  }
  if(act === 'reset'){
    if(confirm('会清空所有记录和她的一切设置，确定吗？')){
      localStorage.removeItem(KEY); S = defaultState(); ob.name=''; window.__step = 0; render();
    }
    return;
  }
}
function onboardNext(){
  collectOnboard();
  const last = ONBOARD_STEPS.length - 1;
  if((window.__step||0) < last){ window.__step = (window.__step||0)+1; render(); window.scrollTo(0,0); return; }
  S.profile = Object.assign(S.profile, {
    name: ob.name || '她', birthday: ob.birthday, anniversary: ob.anniversary,
    babyBirthday: ob.babyBirthday || S.profile.babyBirthday || MY_BABY_BIRTHDAY,
    timeBudget: ob.timeBudget, costBudget: ob.costBudget, likes: ob.likes.slice(), avoid: ob.avoid.slice(), stage: ob.stage
  });
  S.onboarded = true;
  ob.name = ''; ob.birthday=''; ob.anniversary=''; ob.babyBirthday=''; ob.likes=[]; ob.avoid=[];
  save(); window.__step = 0; render();
  setTimeout(()=>toast('她自己也不知道有这个东西'), 400);
}
function askDone(){

    + '<textarea id="done-note" placeholder="她说了什么 / 你当时什么感觉（可以不写）"></textarea>'

    + ['她笑了','她说谢谢','她有点意外','她没什么反应','她好像松口气'].map(x=>'<div class="chip" data-val="'+x+'">'+x+'</div>').join('')

function saveDone(){
  const t = todayPick();
  const note = (document.getElementById('done-note')||{}).value || '';
  const reactEl = document.querySelector('[data-react] .chip.on');
  const react = reactEl ? reactEl.dataset.val : '';
  S.done.push({date:t.date, id:t.task.id, title:t.task.title, cat:t.task.cat, note:note.trim(), react:react});
  save(); closeSheet(); confetti(); render();
  setTimeout(()=>toast('第 '+S.done.length+' 件，记下了'), 300);
  // 顺手问一个"你们的过去"的问题（一天最多一次，带跳过）
  setTimeout(()=>{
    if(!((S.story.on||{})[todayStr()]) && nextStoryQ()) openStorySheet();
  }, 1500);
}
function openStorySheet(){
  const q = nextStoryQ();
  if(!q){ toast('都答完了'); return; }
  window.__storyQ = q.id;
  openSheet(
    '<h2>'+esc(q.stage)+'</h2>'
    + '<div class="muted" style="margin-bottom:12px">'+esc(q.q)+'</div>'
    + '<textarea id="story-a" placeholder="随便写两句就行，不用写好看"></textarea>'
    + '<button class="btn primary" data-act="story-save">记下来</button>'
    + '<button class="btn text" id="story-skip">这个问题跳过</button>'
  );
  const saveBtn = document.querySelector('[data-act="story-save"]');
  if(saveBtn) saveBtn.onclick = saveStory;
  document.getElementById('story-skip').onclick = ()=>{
    const st = S.story;
    if(!st.skipped.includes(q.id)) st.skipped.push(q.id);
    save(); closeSheet(); render();
  };
}
function saveStory(){
  const q = STORY_ALL.find(x => x.id === window.__storyQ) || nextStoryQ();
  if(!q) return;
  const v = ((document.getElementById('story-a')||{}).value || '').trim();
  if(!v){ toast('写一句就行'); return; }
  S.story.answers = S.story.answers || {};
  S.story.answers[q.id] = v;
  S.story.on = S.story.on || {};
  S.story.on[todayStr()] = (S.story.on[todayStr()] || 0) + 1;
  save();
  if(q.t){
    openSheet(
      '<h2>要不要把它变成一件小事？</h2>'
      + '<div class="muted" style="margin-bottom:12px">根据你刚写的这条，可以生成：</div>'
      + '<div class="why" style="margin-bottom:14px">'+esc(q.t)+'</div>'
      + '<button class="btn primary" data-act="story-make">好，加进任务库</button>'
      + '<button class="btn text" id="story-no">先不用</button>'
    );
    const mk = document.querySelector('[data-act="story-make"]');
    if(mk) mk.onclick = ()=>{
      S.profile.custom = S.profile.custom || [];
      S.profile.custom.push({title:q.t, min:q.min||15, cost:q.cost||0});

/* ---------- 导出到手机日历（.ics）——没有服务器也能有提醒 ---------- */
function p2(n){ return String(n).padStart(2,'0'); }
function icsStamp(d){
  return d.getUTCFullYear()+p2(d.getUTCMonth()+1)+p2(d.getUTCDate())+'T'
       + p2(d.getUTCHours())+p2(d.getUTCMinutes())+p2(d.getUTCSeconds())+'Z';
}
function icsEsc(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}
function icsEvent(uid, dateStr, title, desc, alarms, rrule){
  const d = parseDay(dateStr);
  const day = d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate());
  let out = 'BEGIN:VEVENT\r\n'
    + 'UID:'+uid+'\r\n'
    + 'DTSTAMP:'+icsStamp(new Date())+'\r\n'
    + 'DTSTART:'+day+'T090000\r\n'
    + 'DTEND:'+day+'T100000\r\n'
    + 'SUMMARY:'+icsEsc(title)+'\r\n';
  if(desc) out += 'DESCRIPTION:'+icsEsc(desc)+'\r\n';
  if(rrule) out += 'RRULE:'+rrule+'\r\n';
  (alarms||[]).forEach(a=>{
    out += 'BEGIN:VALARM\r\nACTION:DISPLAY\r\nTRIGGER:'+a+'\r\n'
      + 'DESCRIPTION:'+icsEsc(title)+'\r\nEND:VALARM\r\n';
  });
  return out + 'END:VEVENT\r\n';
}
/* 妇女节不导出：有人喜欢被过节，有人反感，不适合默认塞进她的日历 */
const REMIND_FESTIVALS = FESTIVALS.map(f => f.key).filter(k => k !== 'womens');
function buildICS(){
  const today = todayStr();
  const A3 = ['-P7D','-P1D','PT0S'], A1 = ['-P1D'];
  let out = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//OneSmallThing//CN\r\n'
    + 'CALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:'+icsEsc('予伊')+'\r\n';

  const lunarFest = key => {
    const f = FESTIVALS.find(x => x.key === key);
    if(!f || !f.lunar) return null;
    const base = parseDay(today).getFullYear();
    const list = [];
    for(let k = -1; k <= 4; k++){
      const s = festivalSolarDate(f, base + k);
      if(!s) continue;
      const ds = todayStr(new Date(base + k, s.m - 1, s.d));
      if(ds >= today) list.push(ds);
    }
    return list.slice(0, 3);
  };

  upcomingDays(today, 400).forEach(x => {
    const tip = x.tip || '';
    if(x.kind === 'festival'){
      if(!REMIND_FESTIVALS.includes(x.key)) return;
      const l = lunarFest(x.key);
      if(l){                                   // 农历节日：逐年日期不同，导出未来三次
        l.forEach(ds => { out += icsEvent('tfh-'+x.key+'-'+ds.replace(/-/g,'')+'@todayforher', ds, x.label, tip+'（提前一天提醒）', A1, null); });
      } else {
        out += icsEvent('tfh-'+x.key+'@todayforher', x.date, x.label, tip+'（提前一天提醒）', A1, 'FREQ=YEARLY');
      }
      return;
    }
    if(x.kind === 'quiet'){
      out += icsEvent('tfh-'+x.key+'@todayforher', x.date, x.label+'（今天不安排惊喜）',
        '这天不要安排惊喜和庆祝。安静地陪着，做点实事就好。', A1, x.lunar ? null : 'FREQ=YEARLY');
      return;
    }
    // 她的生日 / 纪念日 / 家人相关的日子：提前 7 天、提前 1 天、当天 09:00 各提醒一次
    const isBday = x.key === 'birthday';
    out += icsEvent('tfh-'+x.key+'@todayforher', x.date, x.label,
      (isBday ? '今天是她的生日。打开「予伊」，照着作战包做：早上早起半小时、白天带娃两小时、傍晚三件套、晚上看半场世界杯。'
              : '打开「予伊」，看今天的安排。'),
      A3, x.lunar ? null : 'FREQ=YEARLY');
  });
  return out + 'END:VCALENDAR\r\n';
}
function exportICS(){
  const blob = new Blob([buildICS()], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'today-for-her-'+todayStr()+'.ics';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast('已导出，用手机打开导入日历');
}
